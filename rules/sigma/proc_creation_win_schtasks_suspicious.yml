title: Подозрительная запланированная задача
id: 6d1c3a2e-5b1f-4c3e-9a51-0f3b8d2a1005
status: experimental
description: schtasks /create с запуском интерпретатора или файла из пользовательского каталога.
author: Kirill Shishkin
date: 2026-10-20
references:
    - https://attack.mitre.org/techniques/T1053/005/
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_create:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    selection_payload:
        CommandLine|contains:
            - '\AppData\'
            - '\Temp\'
            - '\Users\Public\'
            - 'powershell'
            - 'cmd.exe /c'
            - 'mshta'
            - 'rundll32'
    condition: all of selection_*
falsepositives:
    - Инсталляторы ПО, создающие задачи обновления
level: high
# Wazuh: rule 100121
